const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},k,b(P.ct));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const pw=document.getElementById("pw").value;
  try{await unlock(pw);try{sessionStorage.setItem("ffpw",pw)}catch(_){}}catch(_){document.getElementById("err").textContent="Wrong password."}});
(async()=>{let s=null;try{s=sessionStorage.getItem("ffpw")}catch(_){} if(s){try{await unlock(s)}catch(_){}}})();
